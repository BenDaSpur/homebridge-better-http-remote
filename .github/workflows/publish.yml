name: Publish to npm

on:
  push:
    branches:
      - latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump version
        run: npm version patch --no-git-tag-version
        env:
          npm_config_yes: 'true'

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date -u +%Y-%m-%d)
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log -30 --pretty=format:"- %s (%h)" --no-merges)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- No detailed changes"
          fi
          SECTION="## [${VERSION}] - ${DATE}"$'\n\n'"${COMMITS}"$'\n\n'
          if [ -f CHANGELOG.md ]; then
            echo "$SECTION$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            echo "# Changelog"$'\n\n'"All notable changes to this project will be documented in this file."$'\n\n'"$SECTION" > CHANGELOG.md
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push version bump and changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: release ${{ steps.changelog.outputs.version }} [skip ci]"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.changelog.outputs.version }}
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --generate-notes
